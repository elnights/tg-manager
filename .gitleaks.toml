title = "TG Manager public repository"

[extend]
useDefault = true

[[rules]]
id = "telegram-api-hash"
description = "Telegram API hash assignment"
regex = '''(?i)(?:tg_api_hash|api[_-]?hash)[\s"'`:=]+([a-f0-9]{32})'''
secretGroup = 1

[[rules]]
id = "telegram-string-session"
description = "Telegram serialized authorization session"
regex = '''(?:^|[\s"'`=])([1][A-Za-z0-9+/_=-]{340,})(?:$|[\s"'`])'''
secretGroup = 1
